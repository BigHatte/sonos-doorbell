# Kopieren nach config.yaml und anpassen.

# IP-Adresse des Rechners, auf dem der Container läuft. Die Sonos-Player rufen
# darüber die Gong-Datei ab: http://<advertise_host>:<port>/sounds/gong.wav
advertise_host: "<ip-des-docker-hosts>"
port: 5005

# Räume, in denen der Gong ohne zones-Parameter spielt ("all" = alle Player).
# Namen wie in der Sonos-App, Groß-/Kleinschreibung egal.
default_zones:
  - Wohnzimmer
  - Küche

# Dateiname ohne Endung aus dem Ordner sounds/ (.mp3 oder .wav).
default_sound: gong

# Lautstärke des Gongs (0-100) und optional abweichend pro Raum. Laufende
# Musik wird währenddessen automatisch leiser gestellt und danach wieder lauter.
default_volume: 30
zone_volumes:
  Küche: 40
  Schlafzimmer: 15

# Weitere Klingelsignale innerhalb dieser Zeit (Sekunden) werden ignoriert.
cooldown_s: 3

# Optional, empfohlen: feste IPs statt automatischer Suche. Ist diese Liste
# gesetzt, wird nicht gesucht (schneller und zuverlässiger, auch unter Docker
# Desktop ohne Multicast).
# players:
#   Wohnzimmer: "<ip-wohnzimmer>"
#   Küche: "<ip-küche>"

# Wie oft die Player-Liste aktualisiert und die Verbindungen zu den Playern
# geprüft werden (Sekunden).
discovery_refresh_s: 300

log_level: INFO
